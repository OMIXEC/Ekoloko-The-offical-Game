name: Build & Verify

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ekoloko-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: No foreign build links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/sanitize-links.py --check

  backend:
    name: Backend build + admin smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch pinned upstreams and apply patches
        run: ./scripts/bootstrap.sh
      - name: Admin CLI smoke
        env:
          EKOLOKO_DB: ${{ github.workspace }}/backend/server/database/ci.db
        run: |
          node admin/cli.js init
          node admin/cli.js batch:create --type code --count 2 \
            --reward '{"coins":10}' --actor ci --out /tmp/ci-codes.csv
          node admin/cli.js batch:list

      - name: Playable session smoke
        env:
          EKOLOKO_HOST: localhost
          GAME_ASSETS_ROOT: ${{ github.workspace }}/client
        run: |
          node admin/cli.js user:create --username orimiz --password Iorimiz11 \
            --email ci@ekoloko.local --actor ci
          (cd backend/server && npm start > /tmp/ekoloko-server.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health > /dev/null && break
            sleep 1
          done
          node tests/qa/session-smoke.mjs

  qa:
    name: Playwright QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch pinned upstreams and apply patches
        run: ./scripts/bootstrap.sh
      - run: npm ci --no-audit --no-fund
        working-directory: tests/qa
      - run: npx playwright install --with-deps chromium
        working-directory: tests/qa
      - name: Start backend and seed QA user
        env:
          EKOLOKO_HOST: localhost
          GAME_ASSETS_ROOT: ${{ github.workspace }}/client
        run: |
          node admin/cli.js user:create --username orimiz --password Iorimiz11 \
            --email ci@ekoloko.local --actor ci
          (cd backend/server && npm start > /tmp/ekoloko-server.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health > /dev/null && break
            sleep 1
          done
      - run: npx playwright test
        working-directory: tests/qa

  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifacts: desktop/dist/*.exe
          - os: ubuntu-latest
            artifacts: desktop/dist/*.AppImage
          - os: macos-latest
            artifacts: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
              desktop/dist/latest-mac.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch pinned upstreams and apply patches
        run: ./scripts/bootstrap.sh
      - run: npm run check
        working-directory: desktop
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never
        working-directory: desktop
      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never
        working-directory: desktop
      - name: Build macOS zip + DMG
        if: matrix.os == 'macos-latest'
        run: |
          npm run dist:mac
          node scripts/createMacDmg.js
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: ${{ matrix.artifacts }}

  docker:
    name: Container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstreams and apply patches
        run: ./scripts/bootstrap.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository }}/backend:ci
      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/client.Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository }}/client:ci
      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push release images
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker build -f docker/backend.Dockerfile -t ghcr.io/${{ github.repository }}/backend:${GITHUB_REF_NAME} .
          docker build -f docker/client.Dockerfile -t ghcr.io/${{ github.repository }}/client:${GITHUB_REF_NAME} .
          docker push ghcr.io/${{ github.repository }}/backend:${GITHUB_REF_NAME}
          docker push ghcr.io/${{ github.repository }}/client:${GITHUB_REF_NAME}

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive terraform
      - name: Validate environments
        run: |
          for dir in terraform/envs/gcp/prod terraform/envs/gcp/dev terraform/envs/aws/prod terraform/envs/aws/dev; do
            echo "== $dir"
            (cd "$dir" && terraform init -backend=false -input=false && terraform validate)
          done

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [links, backend, qa, desktop, docker, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
