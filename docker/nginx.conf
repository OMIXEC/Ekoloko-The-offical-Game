server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index launcher.html index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/xml text/css application/javascript application/json;

    types {
        text/html                             html htm;
        text/xml                              xml;
        application/javascript                js;
        application/json                      json;
        text/css                              css;
        application/x-shockwave-flash         swf;
        application/wasm                      wasm;
        image/jpeg                            jpg jpeg;
        image/png                             png;
        image/gif                             gif;
        audio/mpeg                            mp3;
    }

    location ~* \.(swf|wasm|jpg|jpeg|png|gif|mp3|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(xml|html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /health { proxy_pass http://backend:8080/health; }
    location /ekoloko-web/ { proxy_pass http://backend:8080/ekoloko-web/; proxy_set_header Host $host; }
    location /ekoloko-i18n/ { proxy_pass http://backend:8080/ekoloko-i18n/; proxy_set_header Host $host; }
    location /BlueBox/ { proxy_pass http://backend:8080/BlueBox/; proxy_set_header Host $host; }
    location /static/ { proxy_pass http://backend:8080/static/; }

    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location / { try_files $uri $uri/ =404; }
}
