services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      EKOLOKO_HOST: ${EKOLOKO_HOST:-localhost}
      GAME_ASSETS_ROOT: /app/client
      HTTP_PORT: "8080"
      TCP_PORT: "9339"
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-ekoloko}
      PGUSER: ${PGUSER:-ekoloko}
      PGPASSWORD: ${PGPASSWORD:-change-me}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-insecure-secret-change-me}
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER:-root}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-change-me-please}
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
    volumes:
      - ./client:/app/client:ro
    ports:
      - "8080:8080"
      - "9339:9339"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped

  # Optional prod-like infra: docker compose --profile infra up
  postgres:
    image: postgres:16-alpine
    profiles: ["infra"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ekoloko}
      POSTGRES_USER: ${POSTGRES_USER:-ekoloko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ekoloko} -d ${POSTGRES_DB:-ekoloko}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
